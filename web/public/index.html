<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-commerce Query Processing Demo</title><style>body{font:16px system-ui;margin:3rem auto;max-width:1000px;color:#1f2937;padding:0 1rem}button{padding:.7rem 1rem;margin:.25rem;background:#1d4ed8;color:white;border:0;border-radius:6px;cursor:pointer}input{padding:.7rem}table{border-collapse:collapse;width:100%;margin-top:1rem}td,th{padding:.6rem;border-bottom:1px solid #ddd;text-align:left}pre{overflow:auto}</style></head><body><h1>E-commerce Query Processing Demo</h1><p>MySQL-backed demonstration of filtering, JOIN, and aggregation.</p><input type="number" id="price" value="500" min="0"><button onclick="load('products')">Filter products</button><button onclick="load('orders')">Recent orders (JOIN)</button><button onclick="load('revenue')">Top revenue (GROUP BY)</button><p id="status"></p><div id="result"></div><script>async function load(kind){const url='/api/'+kind+(kind==='products'?'?minPrice='+encodeURIComponent(document.getElementById('price').value):'');document.getElementById('status').textContent='Loading...';try{const r=await fetch(url);const rows=await r.json();if(!r.ok)throw Error(rows.error);const keys=Object.keys(rows[0]||{});const table=document.createElement('table');const head=table.createTHead().insertRow();keys.forEach(k=>{const th=document.createElement('th');th.textContent=k;head.appendChild(th)});const body=table.createTBody();rows.forEach(row=>{const tr=body.insertRow();keys.forEach(k=>{const td=tr.insertCell();td.textContent=String(row[k])})});document.getElementById('result').replaceChildren(table);document.getElementById('status').textContent=rows.length+' results'}catch(e){document.getElementById('status').textContent=e.message}}</script></body></html>
